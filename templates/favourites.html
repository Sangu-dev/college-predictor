<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved Favourite Colleges | KCET Predictor</title>

    <!-- Typography: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0a0f1d;
            --bg-card: rgba(18, 26, 47, 0.75);
            --border-card: rgba(255, 255, 255, 0.08);
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #3b82f6 50%, #06b6d4 100%);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(236, 72, 153, 0.1) 0px, transparent 50%);
            background-attachment: fixed;
            min-height: 100vh;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text-main);
            padding-bottom: 60px;
        }

        .navbar-custom {
            background: rgba(10, 15, 29, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-card);
            padding: 14px 0;
        }

        .brand-logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }
        .brand-icon {
            font-size: 1.35rem;
            color: #818cf8;
        }
        .brand-title {
            font-weight: 800;
            font-size: 1.25rem;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .brand-badge {
            background: rgba(99, 102, 241, 0.18);
            border: 1px solid rgba(99, 102, 241, 0.4);
            color: #c7d2fe !important;
            font-size: 0.72rem;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 999px;
            letter-spacing: 0.04em;
            -webkit-text-fill-color: initial !important;
        }

        .fav-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            backdrop-filter: blur(16px);
            border-radius: 18px;
            padding: 22px;
            height: 100%;
            transition: all 0.25s ease;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .fav-card:hover {
            transform: translateY(-3px);
            border-color: rgba(99, 102, 241, 0.4);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        .badge-college-id {
            background: rgba(99, 102, 241, 0.15);
            color: #a5b4fc;
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 6px;
            padding: 2px 7px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .tier-pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 700;
        }
        .tier-safe { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
        .tier-target { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
        .tier-dream { background: rgba(236, 72, 153, 0.15); color: #f472b6; border: 1px solid rgba(236, 72, 153, 0.3); }

        .btn-remove {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.25);
            color: #f87171;
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.2s;
            cursor: pointer;
        }
        .btn-remove:hover {
            background: rgba(239, 68, 68, 0.25);
            color: #fff;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #cbd5e1;
            border-radius: 10px;
            padding: 8px 16px;
            font-size: 0.88rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            text-decoration: none;
        }
        .action-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- Navigation -->
    <nav class="navbar navbar-custom sticky-top">
        <div class="container d-flex justify-content-between align-items-center">
            <a href="/" class="brand-logo">
                <i class="bi bi-mortarboard-fill brand-icon"></i>
                <span class="brand-title">KCET Predictor</span>
                <span class="brand-badge">Shortlist</span>
            </a>
            <div class="d-flex align-items-center gap-2">
                <a href="/" class="action-btn">
                    <i class="bi bi-arrow-left"></i>
                    <span>Back to Predictor</span>
                </a>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        
        <!-- Header -->
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
            <div>
                <h2 class="fw-bold mb-1">
                    <i class="bi bi-bookmark-star-fill text-warning"></i> My Shortlisted Colleges
                </h2>
                <p class="text-muted mb-0" id="favSubheading">
                    Manage and review your saved college options for KCET / JEE counseling.
                </p>
            </div>
            <div class="d-flex gap-2" id="actionButtons" style="display: none !important;">
                <button class="action-btn" onclick="exportShortlistCSV()">
                    <i class="bi bi-file-earmark-spreadsheet-fill text-success"></i> Export CSV
                </button>
                <button class="action-btn" onclick="window.print()">
                    <i class="bi bi-printer-fill text-info"></i> Print Shortlist
                </button>
                <button class="action-btn text-danger" onclick="clearAllFavourites()">
                    <i class="bi bi-trash3-fill"></i> Clear All
                </button>
            </div>
        </div>

        <!-- Cards Container -->
        <div class="row g-4" id="favContainer">
            <!-- Populated via JavaScript -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="text-center py-5" style="display: none;">
            <div class="mb-4">
                <i class="bi bi-bookmark-star text-white-50" style="font-size: 4rem;"></i>
            </div>
            <h4 class="fw-bold text-white mb-2">No Shortlisted Colleges Yet</h4>
            <p class="text-muted max-w-md mx-auto mb-4" style="max-width: 500px;">
                Explore cutoffs with your rank and bookmark any college to save it to your counseling shortlist.
            </p>
            <a href="/" class="btn btn-primary rounded-pill px-4 py-2 fw-bold d-inline-flex align-items-center gap-2">
                <i class="bi bi-search"></i> Start Predicting Colleges
            </a>
        </div>

    </div>

    <script>
        function getFavourites() {
            try {
                // Support both new structured format and legacy string format
                let raw = localStorage.getItem('kcet_favourites') || localStorage.getItem('favourites');
                if (!raw) return [];
                let parsed = JSON.parse(raw);
                if (parsed.length > 0 && typeof parsed[0] === 'string') {
                    // Convert legacy strings to objects
                    return parsed.map(c => ({
                        college: c,
                        code: '',
                        branch: 'Engineering Branch',
                        category: 'GM',
                        cutoff: 'N/A',
                        tier: 'Saved'
                    }));
                }
                return parsed;
            } catch(e) {
                return [];
            }
        }

        function renderFavourites() {
            let favs = getFavourites();
            let container = document.getElementById('favContainer');
            let emptyState = document.getElementById('emptyState');
            let actionButtons = document.getElementById('actionButtons');
            let sub = document.getElementById('favSubheading');

            container.innerHTML = '';

            if (favs.length === 0) {
                emptyState.style.display = 'block';
                actionButtons.style.setProperty('display', 'none', 'important');
                sub.innerText = "You haven't saved any colleges yet.";
                return;
            }

            emptyState.style.display = 'none';
            actionButtons.style.setProperty('display', 'flex', 'important');
            sub.innerText = `You have ${favs.length} college option${favs.length > 1 ? 's' : ''} saved for counseling.`;

            favs.forEach((item, idx) => {
                let tierBadge = '';
                if (item.tier === 'Safe') {
                    tierBadge = '<span class="tier-pill tier-safe">🟢 Safe</span>';
                } else if (item.tier === 'Target') {
                    tierBadge = '<span class="tier-pill tier-target">🟡 Target</span>';
                } else if (item.tier === 'Dream') {
                    tierBadge = '<span class="tier-pill tier-dream">🔴 Dream</span>';
                }

                let card = document.createElement('div');
                card.className = 'col-md-6 col-lg-4';
                card.innerHTML = `
                    <div class="fav-card">
                        <div>
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                ${item.code ? `<span class="badge-college-id">${item.code}</span>` : '<span></span>'}
                                ${tierBadge}
                            </div>
                            <h5 class="fw-bold mb-2 text-white">${item.college}</h5>
                            <div class="text-info fw-semibold mb-3" style="font-size: 0.9rem;">
                                <i class="bi bi-cpu"></i> ${item.branch || 'Course'}
                            </div>
                            <div class="d-flex gap-2 flex-wrap text-muted small mb-3">
                                <span class="badge bg-dark border border-secondary px-2 py-1">Category: ${item.category || 'GM'}</span>
                                ${item.cutoff && item.cutoff !== 'N/A' ? `<span class="badge bg-dark border border-secondary px-2 py-1">Cutoff: #${Number(item.cutoff).toLocaleString()}</span>` : ''}
                                ${item.district && item.district !== 'Other' ? `<span class="badge bg-primary bg-opacity-10 text-primary border border-primary border-opacity-25 px-2 py-1"><i class="bi bi-geo-alt-fill text-danger me-1"></i>${item.district}</span>` : ''}
                            </div>
                        </div>
                        <div class="d-flex justify-content-between align-items-center pt-3 border-top border-secondary border-opacity-10">
                            <small class="text-muted" style="font-size: 0.75rem;">Option #${idx + 1}</small>
                            <button class="btn-remove" onclick="removeFavourite(${idx})">
                                <i class="bi bi-trash3"></i> Remove
                            </button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function removeFavourite(index) {
            let favs = getFavourites();
            favs.splice(index, 1);
            localStorage.setItem('kcet_favourites', JSON.stringify(favs));
            localStorage.setItem('favourites', JSON.stringify(favs.map(i => i.college)));
            renderFavourites();
        }

        function clearAllFavourites() {
            if (confirm("Are you sure you want to clear your entire shortlisted colleges?")) {
                localStorage.removeItem('kcet_favourites');
                localStorage.removeItem('favourites');
                renderFavourites();
            }
        }

        function exportShortlistCSV() {
            let favs = getFavourites();
            if (favs.length === 0) return;
            let csv = ["Option,College Code,College Name,Branch,Category,District,Cutoff Rank,Tier"];
            favs.forEach((item, idx) => {
                csv.push(`"${idx+1}","${item.code || ''}","${item.college.replace(/"/g, '""')}","${(item.branch||'').replace(/"/g, '""')}","${item.category||''}","${(item.district||'').replace(/"/g, '""')}","${item.cutoff||''}","${item.tier||''}"`);
            });
            let csvContent = "data:text/csv;charset=utf-8," + csv.join("\n");
            let encodedUri = encodeURI(csvContent);
            let link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `kcet_college_shortlist.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        document.addEventListener('DOMContentLoaded', renderFavourites);
    </script>
</body>
</html>
